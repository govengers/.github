name: CI

on:
  push:
    branches: [$default-branch]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: every test, uncached

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-library:
    uses: govengers/.github/.github/workflows/go-library.yml@v1
    with:
      full: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: write # the badges job pushes test and coverage badges to the badges branch
