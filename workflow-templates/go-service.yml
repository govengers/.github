name: CI

# The govengers service pipeline (go-service.yml): every pull request and push to the default branch runs the hot
# path, capped at 10 minutes from the run's start to the pushed image (hot-path-seconds, TST-018); the cap is the one
# hard time limit, the budgets below only warn. Nightly, on demand (Actions, Run workflow) and on v* tags: every test,
# uncached; a red nightly or dispatched run opens an issue for the logins in CI_ALERT_ASSIGNEES (TST-021).
on:
  push:
    branches: [$default-branch]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly, on demand and on v* tags: every test, uncached
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }} # a full run and a push never wait for each other
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-service:
    uses: govengers/.github/.github/workflows/go-service.yml@v1
    with:
      image: ghcr.io/${{ github.repository }}
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      hot-path-seconds: 600 # fails a push over 10 minutes and a pull request over 9; the image is built beside the checks
      # bun-version: "1.4.4" # a frontend: Bun in every job and `just test-typescript`
      # recipes: '["generate-check", "db-check"]' # extra recipes, one job each
      # browser: ui-e2e # with a frontend: the browser journeys the change needs (TST-020)
      budget-warm-seconds: 300 # warns over 5 minutes (+20 %) with warm caches
      budget-cold-seconds: 480 # and over 8 minutes cold
    permissions:
      contents: write # badges branch
      packages: write # push to ghcr.io
      id-token: write # keyless signing of the build provenance
      attestations: write # store the attestation
      actions: read # check reads the run's job times

  alert:
    needs: go-service
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    uses: govengers/.github/.github/workflows/nightly-alert.yml@v1
    with:
      result: ${{ needs.go-service.result }}
      # Set CI_ALERT_ASSIGNEES before the first nightly (an org variable, or a repository variable for a private
      # repository on the free plan): without a login that can be assigned the alert job fails every scheduled
      # and dispatched run.
      assignees: ${{ vars.CI_ALERT_ASSIGNEES }}
    permissions:
      issues: write # the issue of a red full run
      actions: read # its failed jobs
